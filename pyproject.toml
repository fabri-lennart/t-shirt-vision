[project]
name = "t-shirt-vision"
version = "0.1.0"
description = "Conveyor belt t-shirt counter"
requires-python = ">=3.12,<3.13"
dependencies = [
    "loguru>=0.7.3",
    "opencv-python>=4.9.0.80",
    "pyyaml>=6.0",
    "supervision>=0.21.0",
    "torch==2.5.1+cu121; sys_platform == 'win32'",
    "torchvision==0.20.1+cu121; sys_platform == 'win32'",
    "trackers>=2.6.1",
    "ultralytics>=8.2.0",
]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121", marker = "sys_platform == 'win32'" }
torchvision = { index = "pytorch-cu121", marker = "sys_platform == 'win32'" }
